<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta http-equiv="refresh" content="0; url=https://mr-biker-admin.vercel.app/" />
  <title>MR Biker Admin Login</title>
  <script>window.location.replace('https://mr-biker-admin.vercel.app/');</script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, rgba(170, 221, 0, 0.18), transparent 28rem), #000;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(92vw, 460px);
      border: 1px solid #222;
      border-radius: 28px;
      padding: 28px;
      background: rgba(10, 10, 10, 0.92);
      box-shadow: 0 24px 80px rgba(0,0,0,.55);
      text-align: center;
    }
    .mark {
      width: 58px;
      height: 58px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: #AADD00;
      color: #000;
      font-weight: 1000;
      letter-spacing: -0.05em;
    }
    h1 { margin: 0; font-size: 1.6rem; }
    p { color: #999; line-height: 1.6; }
    a {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      margin-top: 8px;
      padding: 0 18px;
      border-radius: 999px;
      background: #AADD00;
      color: #000;
      font-weight: 900;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark">MR</div>
    <h1>Opening MR Biker Admin login…</h1>
    <p>The marketing landing page has been removed. You are being sent to the real API-key protected admin dashboard.</p>

  </main>
</body>
</html>
